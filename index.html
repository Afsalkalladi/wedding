<!doctype html>
<html lang="en" class="light" translate="no" style="color-scheme: light only">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/fonts/typekit.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Fathima Shahadiya &amp; Mohammed Ajmal P's Wedding</title>
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="Join us as Fathima Shahadiya and Mohammed Ajmal P begin their new life together."
    />

    <!-- Link previews (WhatsApp, iMessage, Facebook, Telegram…).
         %SITE_URL% is filled in at build time from VITE_SITE_URL — see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Wedding Invitation" />
    <meta
      property="og:description"
      content="Join us as we begin our new life together."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Illustration of Fathima Shahadiya and Mohammed Ajmal P" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wedding Invitation" />
    <meta
      name="twitter:description"
      content="Join us as we begin our new life together."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
