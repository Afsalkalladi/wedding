<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <!-- Banquet hall: a domed pavilion with arcade, drawn to match the ornament. -->
  <g fill="none" stroke="#3A5542" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground -->
    <path d="M20,330 H540" stroke-width="2.5" stroke-opacity="0.45"/>

    <!-- central block -->
    <g stroke-width="3" stroke-opacity="0.6">
      <path d="M180,330 V170 H380 V330"/>
      <!-- dome -->
      <path d="M180,170 Q280,44 380,170"/>
      <path d="M280,44 V18"/>
      <path d="M280,2 A14,14 0 1 0 290,26 A11,11 0 1 1 280,2 Z"/>
      <!-- entrance arch -->
      <path d="M244,330 V246 Q280,196 316,246 V330"/>
      <path d="M256,330 V250 Q280,212 304,250 V330" stroke-opacity="0.3" stroke-width="1.5"/>
    </g>

    <!-- side arcades -->
    <g stroke-width="2.5" stroke-opacity="0.5">
      <path d="M92,330 V228 H180"/>
      <path d="M380,330 V228 H468"/>
      <path d="M112,330 V268 Q130,240 148,268 V330"/>
      <path d="M412,330 V268 Q430,240 448,268 V330"/>
      <path d="M92,228 Q136,196 180,228" stroke-opacity="0.3"/>
      <path d="M380,228 Q424,196 468,228" stroke-opacity="0.3"/>
    </g>

    <!-- minarets -->
    <g stroke-width="2.5" stroke-opacity="0.5">
      <path d="M68,330 V150 Q80,132 92,150 V330"/>
      <path d="M68,182 H92"/>
      <path d="M80,132 V112"/>
      <path d="M468,330 V150 Q480,132 492,150 V330"/>
      <path d="M468,182 H492"/>
      <path d="M480,132 V112"/>
    </g>

    <!-- lattice windows -->
    <g stroke-width="1.4" stroke-opacity="0.3">
      <path d="M204,206 H228 V230 H204 Z"/><path d="M216,194 L240,218 L216,242 L192,218 Z"/>
      <path d="M332,206 H356 V230 H332 Z"/><path d="M344,194 L368,218 L344,242 L320,218 Z"/>
      <path d="M268,110 H292 V134 H268 Z"/><path d="M280,98 L304,122 L280,146 L256,122 Z"/>
    </g>

    <!-- palms -->
    <g stroke-width="2.2" stroke-opacity="0.4">
      <path d="M40,330 Q36,280 44,248"/>
      <path d="M44,248 Q22,236 12,248"/><path d="M44,248 Q66,236 76,248"/>
      <path d="M44,248 Q28,224 30,206"/><path d="M44,248 Q60,224 58,206"/>
      <path d="M520,330 Q516,286 524,258"/>
      <path d="M524,258 Q504,246 494,258"/><path d="M524,258 Q544,246 554,258"/>
      <path d="M524,258 Q510,236 512,218"/><path d="M524,258 Q538,236 536,218"/>
    </g>
  </g>
</svg>
